<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FARN - Limpando cache...</title>
<style>
  body{font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .box{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:32px;max-width:520px;box-shadow:0 8px 30px rgba(15,23,42,.08);text-align:center}
  h1{font-size:20px;color:#0f766e;margin:0 0 12px}
  p{font-size:14px;color:#475569;line-height:1.6}
  pre{text-align:left;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-size:12px;color:#334155;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
  <h1>Limpando cache do FARN...</h1>
  <p id="msg">Aguarde um instante.</p>
  <pre id="log"></pre>
</div>
<script>
(async function () {
  var log = document.getElementById('log');
  var msg = document.getElementById('msg');
  function linha(t) { log.textContent += t + '\n'; }

  try {
    /* 1) Remove service workers antigos (o cache preso no navegador). */
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var i = 0; i < regs.length; i++) {
        await regs[i].unregister();
        linha('Service worker removido: ' + regs[i].scope);
      }
    }

    /* 2) Apaga todos os caches do Cache Storage. */
    if (window.caches && caches.keys) {
      var chaves = await caches.keys();
      for (var j = 0; j < chaves.length; j++) {
        await caches.delete(chaves[j]);
        linha('Cache apagado: ' + chaves[j]);
      }
    }

    /* 3) Apaga o espelho de dados antigo salvo pelo FarnDB.
          Mantem farn_api_config para nao perder a URL do servidor. */
    var apagar = ['farn_db_cache_v1', 'farn_db_queue_v1', 'farn_db_since_v1',
                  'farn_foto_ver_', 'farn_foto_', 'foto3x4_'];
    apagar.forEach(function (chave) {
      try { localStorage.removeItem(chave); linha('LocalStorage limpo: ' + chave); } catch (e) {}
    });

    linha('Pronto! Redirecionando...');
    msg.textContent = 'Concluído! Abrindo o app...';
  } catch (e) {
    msg.textContent = 'Erro: ' + e.message;
    linha('ERRO: ' + e.stack);
    return;
  }

  setTimeout(function () { location.replace('index.html'); }, 1200);
})();
</script>
</body>
</html>
