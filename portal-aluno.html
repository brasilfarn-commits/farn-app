<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal do Aluno - FARN</title>
    <link rel="icon" href="logo-farn.png.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
        html, body { min-height:100vh; background:#f1f5f9; color:#1e293b; }
        body { display:flex; align-items:center; justify-content:center; padding:24px; }
        .card { background:#fff; border-radius:22px; padding:44px 36px; width:100%; max-width:460px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.12); }
        .icon { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#16a34a,#15803d); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
        .icon i { font-size:30px; color:#fff; }
        .card h2 { font-size:22px; font-weight:800; color:#0f172a; margin:10px 0; }
        .card p { font-size:14px; line-height:1.7; color:#64748b; }
        .tag { display:inline-block; margin-top:20px; background:#eff6ff; color:#1d4ed8; font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:6px 14px; border-radius:999px; }
        #voltarPortalAluno {
            position:fixed; bottom:16px; left:16px; z-index:9999; width:44px; height:44px; border-radius:50%;
            background:#0a1c40; color:#fff; border:1px solid rgba(212,175,55,.55); box-shadow:0 4px 14px rgba(0,0,0,.35);
            display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:transform .15s;
        }
        #voltarPortalAluno:hover { transform:scale(1.08); }
        .btn-sair-portal {
            position:fixed; top:16px; right:16px; z-index:9999; width:44px; height:44px; border-radius:50%;
            background:#0a1c40; color:#fff; border:1px solid rgba(212,175,55,.55); box-shadow:0 4px 14px rgba(0,0,0,.35);
            display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:transform .15s;
        }
        .btn-sair-portal:hover { transform:scale(1.08); }
        .btn-menu-aluno {
            position:fixed; top:16px; left:16px; z-index:9999; width:44px; height:44px; border-radius:50%;
            background:#0a1c40; color:#fff; border:1px solid rgba(212,175,55,.55); box-shadow:0 4px 14px rgba(0,0,0,.35);
            display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:transform .15s;
        }
        .btn-menu-aluno:hover { transform:scale(1.08); }
        .menu-aluno-overlay {
            position:fixed; inset:0; z-index:9998; background:rgba(20,10,50,.45); backdrop-filter:blur(2px);
            display:none;
        }
        .menu-aluno-overlay.aberto { display:block; }
        .menu-aluno-drawer {
            position:fixed; top:0; left:0; bottom:0; width:min(300px,84vw); z-index:9999;
            background:#fff; border-right:1px solid rgba(0,0,0,.1); box-shadow:10px 0 40px rgba(80,63,205,.08);
            transform:translateX(-100%); transition:transform .3s ease;
            display:flex; flex-direction:column;
        }
        .menu-aluno-drawer.aberto { transform:translateX(0); }
        .menu-aluno-head {
            display:flex; align-items:center; justify-content:space-between; padding:20px 18px 14px;
            border-bottom:1px solid rgba(0,0,0,.06);
        }
        .menu-aluno-logo { width:36px; height:36px; object-fit:contain; background:#fff; border-radius:12px; padding:2px; border:1px solid rgba(0,0,0,.06); }
        .menu-aluno-close {
            width:32px; height:32px; border-radius:10px; border:1px solid #e2e8f0; background:#f5f4fb;
            color:#475569; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
            font-size:14px; transition:.2s;
        }
        .menu-aluno-close:hover { background:#ece5ff; color:#5b21b6; }
        .menu-aluno-itens { list-style:none; margin:14px 0 0; padding:0 12px; flex:1; overflow-y:auto; }
        .menu-aluno-item {
            display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px;
            color:#334155; text-decoration:none; font-weight:600; font-size:13.5px; transition:.2s;
        }
        .menu-aluno-item:hover { background:#f5f4fb; }
        .menu-aluno-item i { width:20px; text-align:center; color:#7c5cff; font-size:15px; }
        .menu-aluno-item.ativo { background:#f1edff; color:#5b21b6; }
        @media (max-width:640px) { .card { padding:32px 26px; } .btn-sair-portal { top:12px; right:12px; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fa-solid fa-chalkboard-user"></i></div>
        <h2>Portal do Aluno</h2>
        <p>Esta área está sendo preparada e em breve estará disponível para todos os alunos ativos das turmas em andamento.</p>
        <span class="tag">Em construção</span>
    </div>
    <button class="btn-sair-portal" onclick="sairDoPortalAluno()" title="Sair do Portal do Aluno"><i class="fa-solid fa-right-from-bracket"></i></button>
    <button class="btn-menu-aluno" id="btnMenuAluno" onclick="toggleMenuAluno()" title="Abrir menu"><i class="fa-solid fa-bars"></i></button>
    <div id="menuAlunoOverlay" class="menu-aluno-overlay" onclick="fecharMenuAluno()"></div>
    <nav id="menuAlunoDrawer" class="menu-aluno-drawer" aria-hidden="true">
        <div class="menu-aluno-head">
            <div style="display:flex;align-items:center;gap:10px">
                <img src="logo-farn.png.png" alt="FARN" class="menu-aluno-logo">
                <span style="font-weight:700;color:#0f172a">FARN</span>
            </div>
            <button class="menu-aluno-close" onclick="fecharMenuAluno()" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-aluno-itens">
            <li><a class="menu-aluno-item" href="index.html" onclick="fecharMenuAluno()"><i class="fa-solid fa-house"></i> Início</a></li>
        </ul>
    </nav>
    <div id="voltarPortalAluno" onclick="voltarPortalAluno()" title="Voltar a pagina anterior"><i class="fa-solid fa-arrow-left"></i></div>
    <script>
        function voltarPortalAluno() {
            if (history.length > 1) history.back();
            else location.href = 'index.html';
        }
        function sairDoPortalAluno() {
            /* Desloga a sessao do aluno e volta para o index */
            try { localStorage.removeItem('pa_lembrar_cpf'); } catch(e) {}
            try { localStorage.removeItem('pa_lembrar_senha'); } catch(e) {}
            try { localStorage.removeItem('farn_login'); } catch(e) {}
            location.href = 'index.html';
        }
        function toggleMenuAluno() {
            var drawer = document.getElementById('menuAlunoDrawer');
            var overlay = document.getElementById('menuAlunoOverlay');
            var aberto = drawer.classList.contains('aberto');
            var abrir = !aberto;
            drawer.classList.toggle('aberto', abrir);
            overlay.classList.toggle('aberto', abrir);
            drawer.setAttribute('aria-hidden', String(!abrir));
            document.body.style.overflow = abrir ? 'hidden' : '';
        }
        function fecharMenuAluno() {
            var drawer = document.getElementById('menuAlunoDrawer');
            var overlay = document.getElementById('menuAlunoOverlay');
            drawer.classList.remove('aberto');
            overlay.classList.remove('aberto');
            drawer.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }
    </script>
</body>
</html>
