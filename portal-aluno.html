<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal do Aluno - FARN</title>
    <link rel="icon" href="logo-farn.png.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
        html, body { min-height:100vh; background:#f1f5f9; color:#1e293b; }
        body { display:flex; align-items:center; justify-content:center; padding:24px; }
        .card { background:#fff; border-radius:22px; padding:44px 36px; width:100%; max-width:460px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.12); }
        .icon { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#16a34a,#15803d); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
        .icon i { font-size:30px; color:#fff; }
        .card h2 { font-size:22px; font-weight:800; color:#0f172a; margin:10px 0; }
        .card p { font-size:14px; line-height:1.7; color:#64748b; }
        .tag { display:inline-block; margin-top:20px; background:#eff6ff; color:#1d4ed8; font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:6px 14px; border-radius:999px; }
        #voltarPortalAluno {
            position:fixed; bottom:16px; left:16px; z-index:9999; width:44px; height:44px; border-radius:50%;
            background:#0a1c40; color:#fff; border:1px solid rgba(212,175,55,.55); box-shadow:0 4px 14px rgba(0,0,0,.35);
            display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:transform .15s;
        }
        #voltarPortalAluno:hover { transform:scale(1.08); }
        .btn-sair-portal {
            position:fixed; top:16px; right:16px; z-index:9999; width:44px; height:44px; border-radius:50%;
            background:#0a1c40; color:#fff; border:1px solid rgba(212,175,55,.55); box-shadow:0 4px 14px rgba(0,0,0,.35);
            display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:transform .15s;
        }
        .btn-sair-portal:hover { transform:scale(1.08); }
        @media (max-width:640px) { .card { padding:32px 26px; } .btn-sair-portal { top:12px; right:12px; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fa-solid fa-chalkboard-user"></i></div>
        <h2>Portal do Aluno</h2>
        <p>Esta área está sendo preparada e em breve estará disponível para todos os alunos ativos das turmas em andamento.</p>
        <span class="tag">Em construção</span>
    </div>
    <button class="btn-sair-portal" onclick="sairDoPortalAluno()" title="Sair do Portal do Aluno"><i class="fa-solid fa-right-from-bracket"></i></button>
    <div id="voltarPortalAluno" onclick="voltarPortalAluno()" title="Voltar a pagina anterior"><i class="fa-solid fa-arrow-left"></i></div>
    <script>
        function voltarPortalAluno() {
            if (history.length > 1) history.back();
            else location.href = 'index.html';
        }
        function sairDoPortalAluno() {
            /* Desloga a sessao do aluno e volta para o index */
            try { localStorage.removeItem('pa_lembrar_cpf'); } catch(e) {}
            try { localStorage.removeItem('pa_lembrar_senha'); } catch(e) {}
            try { localStorage.removeItem('farn_login'); } catch(e) {}
            location.href = 'index.html';
        }
    </script>
</body>
</html>
