<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal do Aluno - FARN</title>
    <link rel="icon" href="logo-farn.png.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
        html, body { min-height:100vh; background:#f1f5f9; color:#1e293b; }
        body { display:flex; align-items:center; justify-content:center; padding:24px; }
        .card { background:#fff; border-radius:22px; padding:44px 36px; width:100%; max-width:460px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.12); }
        .icon { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#16a34a,#15803d); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
        .icon i { font-size:30px; color:#fff; }
        .card h2 { font-size:22px; font-weight:800; color:#0f172a; margin:10px 0; }
        .card p { font-size:14px; line-height:1.7; color:#64748b; }
        .tag { display:inline-block; margin-top:20px; background:#eff6ff; color:#1d4ed8; font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:6px 14px; border-radius:999px; }
        #voltarPortalAluno {
            position:fixed; bottom:16px; left:16px; z-index:9999; width:44px; height:44px; border-radius:50%;
            background:#0a1c40; color:#fff; border:1px solid rgba(212,175,55,.55); box-shadow:0 4px 14px rgba(0,0,0,.35);
            display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:transform .15s;
        }
        #voltarPortalAluno:hover { transform:scale(1.08); }
        .btn-sair-portal {
            position:fixed; top:16px; right:16px; z-index:9999; width:44px; height:44px; border-radius:50%;
            background:#0a1c40; color:#fff; border:1px solid rgba(212,175,55,.55); box-shadow:0 4px 14px rgba(0,0,0,.35);
            display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:transform .15s;
        }
        .btn-sair-portal:hover { transform:scale(1.08); }
        .btn-menu-aluno {
            position:fixed; top:16px; left:16px; z-index:9999; width:44px; height:44px; border-radius:50%;
            background:#0a1c40; color:#fff; border:1px solid rgba(212,175,55,.55); box-shadow:0 4px 14px rgba(0,0,0,.35);
            display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:transform .15s;
        }
        .btn-menu-aluno:hover { transform:scale(1.08); }
        .menu-aluno-overlay {
            position:fixed; inset:0; z-index:9998; background:rgba(20,10,50,.45); backdrop-filter:blur(2px);
            display:none;
        }
        .menu-aluno-overlay.aberto { display:block; }
        .menu-aluno-drawer {
            position:fixed; top:0; left:0; bottom:0; width:min(300px,84vw); z-index:9999;
            background:#fff; border-right:1px solid rgba(0,0,0,.1); box-shadow:10px 0 40px rgba(80,63,205,.08);
            transform:translateX(-100%); transition:transform .3s ease;
            display:flex; flex-direction:column;
        }
        .menu-aluno-drawer.aberto { transform:translateX(0); }
        .menu-aluno-head {
            display:flex; align-items:center; justify-content:space-between; padding:20px 18px 14px;
            border-bottom:1px solid rgba(0,0,0,.06);
        }
        .menu-aluno-logo { width:36px; height:36px; object-fit:contain; background:#fff; border-radius:12px; padding:2px; border:1px solid rgba(0,0,0,.06); }
        .menu-aluno-close {
            width:32px; height:32px; border-radius:10px; border:1px solid #e2e8f0; background:#f5f4fb;
            color:#475569; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
            font-size:14px; transition:.2s;
        }
        .menu-aluno-close:hover { background:#ece5ff; color:#5b21b6; }
        .menu-aluno-itens { list-style:none; margin:14px 0 0; padding:0 12px; flex:1; overflow-y:auto; }
        .menu-aluno-item {
            display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px;
            color:#334155; text-decoration:none; font-weight:600; font-size:13.5px; transition:.2s;
        }
        .menu-aluno-item:hover { background:#f5f4fb; }
        .menu-aluno-item i { width:20px; text-align:center; color:#7c5cff; font-size:15px; }
        .menu-aluno-item.ativo { background:#f1edff; color:#5b21b6; }
        .secao-meus-dados { margin: 34px auto 0; max-width: 560px; width: 100%; padding: 0 18px; }
        .secao-meus-dados-titulo { font-size: 20px; font-weight: 800; color: #0f172a; margin: 0 0 18px; text-align: center; }
        .meus-dados-grid {
            background: #fff; border-radius: 18px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.06);
            border: 1px solid rgba(0,0,0,.05); display: flex; flex-direction: column; gap: 16px;
        }
        .meus-dados-linha { display: flex; flex-direction: column; gap: 4px; }
        .meus-dados-linha-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .meus-dados-rotulo { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; }
        .meus-dados-valor { font-size: 14px; font-weight: 600; color: #0f172a; word-break: break-word; }
        .meus-dados-valor-edit { display: flex; gap: 6px; align-items: center; }
        .meus-dados-valor-edit input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 13px; color: #0f172a; }
        .meus-dados-valor-edit input:focus { outline: none; border-color: #7c5cff; box-shadow: 0 0 0 4px rgba(124,92,255,.12); }
        .meus-dados-btn { background: linear-gradient(135deg,#7c5cff,#5b21b6); border: none; border-radius: 8px; color: #fff; font-size: 11px; font-weight: 700; padding: 6px 12px; cursor: pointer; transition: .2s; }
        .meus-dados-btn:hover { filter: brightness(1.08); }
        .meus-dados-img { width: 90px; height: 120px; object-fit: cover; border-radius: 12px; border: 1px solid #e2e8f0; display: block; }
        .meus-dados-sem-foto { text-align: center; padding: 18px 12px; color: #94a3b8; font-size: 13px; background: #f8fafc; border-radius: 12px; border: 2px dashed #ddd6fe; }
        @media (max-width:640px) {
            .card { padding:32px 26px; }
            .btn-sair-portal { top:12px; right:12px; }
            .secao-meus-dados { margin-top: 26px; }
            .secao-meus-dados-titulo { font-size: 18px; }
            .meus-dados-grid { padding: 18px; }
            .meus-dados-btn { padding: 6px 10px; font-size: 10.5px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fa-solid fa-chalkboard-user"></i></div>
        <h2>Portal do Aluno</h2>
        <p>Esta área está sendo preparada e em breve estará disponível para todos os alunos ativos das turmas em andamento.</p>
        <span class="tag">Em construção</span>
    </div>
    <section id="meusDados" class="secao-meus-dados">
        <h3 class="secao-meus-dados-titulo">Meus Dados</h3>
        <div id="meusDadosGrid"></div>
    </section>
    <button class="btn-sair-portal" onclick="sairDoPortalAluno()" title="Sair do Portal do Aluno"><i class="fa-solid fa-right-from-bracket"></i></button>
    <button class="btn-menu-aluno" id="btnMenuAluno" onclick="toggleMenuAluno()" title="Abrir menu"><i class="fa-solid fa-bars"></i></button>
    <div id="menuAlunoOverlay" class="menu-aluno-overlay" onclick="fecharMenuAluno()"></div>
    <nav id="menuAlunoDrawer" class="menu-aluno-drawer" aria-hidden="true">
        <div class="menu-aluno-head">
            <div style="display:flex;align-items:center;gap:10px">
                <img src="logo-farn.png.png" alt="FARN" class="menu-aluno-logo">
                <span style="font-weight:700;color:#0f172a">FARN</span>
            </div>
            <button class="menu-aluno-close" onclick="fecharMenuAluno()" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-aluno-itens">
            <li><a class="menu-aluno-item" href="index.html" onclick="fecharMenuAluno()"><i class="fa-solid fa-house"></i> Início</a></li>
            <li><a class="menu-aluno-item" href="#meusDados" onclick="fecharMenuAluno()"><i class="fa-solid fa-user"></i> Meus Dados</a></li>
        </ul>
    </nav>
    <div id="voltarPortalAluno" onclick="voltarPortalAluno()" title="Voltar a pagina anterior"><i class="fa-solid fa-arrow-left"></i></div>
    <script>
        function voltarPortalAluno() {
            if (history.length > 1) history.back();
            else location.href = 'index.html';
        }
        function sairDoPortalAluno() {
            /* Desloga a sessao do aluno e volta para o index */
            try { localStorage.removeItem('pa_lembrar_cpf'); } catch(e) {}
            try { localStorage.removeItem('pa_lembrar_senha'); } catch(e) {}
            try { localStorage.removeItem('farn_login'); } catch(e) {}
            location.href = 'index.html';
        }
        function toggleMenuAluno() {
            var drawer = document.getElementById('menuAlunoDrawer');
            var overlay = document.getElementById('menuAlunoOverlay');
            var aberto = drawer.classList.contains('aberto');
            var abrir = !aberto;
            drawer.classList.toggle('aberto', abrir);
            overlay.classList.toggle('aberto', abrir);
            drawer.setAttribute('aria-hidden', String(!abrir));
            document.body.style.overflow = abrir ? 'hidden' : '';
        }
        function fecharMenuAluno() {
            var drawer = document.getElementById('menuAlunoDrawer');
            var overlay = document.getElementById('menuAlunoOverlay');
            drawer.classList.remove('aberto');
            overlay.classList.remove('aberto');
            drawer.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        /* ===== MEUS DADOS ===== */
        var MD_dados = null;
        var MD_docId = null;

        function MD_esc(v) { return String(v == null ? '' : v); }

        function MD_foto() {
            if (!MD_dados || !MD_dados.cpf) return null;
            try {
                return localStorage.getItem('farn_photo_' + MD_dados.cpf) || localStorage.getItem('foto3x4_' + MD_dados.cpf) || null;
            } catch (e) { return null; }
        }

        function MD_render() {
            var el = document.getElementById('meusDadosGrid');
            if (!el) return;
            function linha(rotulo, valor, editavel, chave) {
                var html = '<div class="meus-dados-linha"><div class="meus-dados-linha-head"><span class="meus-dados-rotulo">' + rotulo + '</span>';
                if (editavel) html += '<button class="meus-dados-btn" onclick="MD_edit(\'' + chave + '\')">Editar</button>';
                html += '</div><div class="meus-dados-valor" id="md-val-' + chave + '">' + MD_esc(valor) + '</div></div>';
                return html;
            }
            if (!MD_dados) { el.innerHTML = '<p style="text-align:center;color:#94a3b8;font-size:13px">Dados não encontrados.</p>'; return; }
            var foto = MD_foto();
            el.innerHTML =
                linha('NOME', MD_dados.nome, false, 'nome') +
                linha('CPF', MD_dados.cpf, false, 'cpf') +
                linha('MATRÍCULA', MD_dados.matricula, false, 'matricula') +
                linha('DATA DE NASCIMENTO', MD_dados.nascimento, false, 'nascimento') +
                linha('TELEFONE', MD_dados.whatsapp, true, 'whatsapp') +
                linha('EMAIL', MD_dados.email, true, 'email') +
                '<div class="meus-dados-linha"><div class="meus-dados-linha-head"><span class="meus-dados-rotulo">FOTO 3X4</span></div><div style="margin-top:6px">' +
                    (foto ? '<img class="meus-dados-img" src="' + MD_esc(foto) + '" alt="Foto 3x4">' : '<div class="meus-dados-sem-foto">Nenhuma foto 3x4 cadastrada.</div>') +
                '</div></div>' +
                linha('SENHA', MD_dados.senha, true, 'senha');
        }

        function MD_carregar() {
            var cpf = (localStorage.getItem('pa_lembrar_cpf') || '').replace(/\D/g, '');
            if (!cpf) {
                var grid = document.getElementById('meusDadosGrid');
                if (grid) grid.innerHTML = '<p style="text-align:center;color:#94a3b8;font-size:13px">Faça login no index para acessar Meus Dados.</p>';
                return;
            }
            dbLive.collection('candidatos').where('cpf', '==', cpf).limit(1).get().then(function(snap) {
                if (snap.empty) {
                    var grid2 = document.getElementById('meusDadosGrid');
                    if (grid2) grid2.innerHTML = '<p style="text-align:center;color:#94a3b8;font-size:13px">Cadastro não encontrado.</p>';
                    return;
                }
                MD_dados = snap.docs[0].data();
                MD_docId = snap.docs[0].id;
                if (!MD_dados.senha) MD_dados.senha = localStorage.getItem('pa_lembrar_senha') || '';
                MD_render();
            }).catch(function(e) { console.warn('Falha ao carregar Meus Dados:', e); });
        }

        function MD_edit(campo) {
            if (!MD_dados) return;
            /* Pede a confirmação da senha do aluno logado antes de editar */
            var senhaCorreta = String(localStorage.getItem('pa_lembrar_senha') || MD_dados.senha || '').trim();
            var conf = window.prompt('Digite a sua senha atual para confirmar:');
            if (conf === null) return;
            if (String(conf).trim() !== senhaCorreta) { alert('Senha de confirmação inválida.'); return; }
            var valorEl = document.getElementById('md-val-' + campo);
            if (!valorEl) return;
            valorEl.innerHTML =
                '<div class="meus-dados-valor-edit">' +
                '<input id="md-edit-input-' + campo + '" type="text" value="' + MD_esc(MD_dados[campo]) + '">' +
                '<button class="meus-dados-btn" onclick="MD_salvar(\'' + campo + '\')">Salvar</button>' +
                '<button class="meus-dados-btn" onclick="MD_render()">Cancelar</button>' +
                '</div>';
            var inp = document.getElementById('md-edit-input-' + campo);
            if (inp) { setTimeout(function(){ inp.focus(); inp.select(); }, 0); }
        }

        function MD_salvar(campo) {
            if (!MD_dados || !MD_docId) { MD_render(); return; }
            var input = document.getElementById('md-edit-input-' + campo);
            var novo = (input ? input.value : '').trim();
            if (campo === 'senha' && !novo) { alert('Informe a nova senha.'); return; }
            if (campo === 'email' && !novo) { alert('Informe o e-mail.'); return; }
            if (campo === 'whatsapp' && !novo) { alert('Informe o telefone.'); return; }
            var upd = {};
            upd[campo] = novo;
            dbLive.doc('candidatos/' + MD_docId).update(upd).then(function() {
                MD_dados[campo] = novo;
                if (campo === 'senha') { try { localStorage.setItem('pa_lembrar_senha', novo); } catch (e) {} }
                MD_render();
                alert('Dado alterado com sucesso.');
            }).catch(function(e) { alert('Erro ao salvar: ' + e.message); });
        }

        MD_carregar();
    </script>
</body>
</html>
