<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>FARN - Recuperar Dados</title>
<style>
body{font-family:Arial,sans-serif;padding:40px;background:#111;color:#eee}
h1{color:#16a34a}h2{color:#4caf50;margin-top:30px}
#results{background:#222;padding:20px;border-radius:8px;margin-top:20px;white-space:pre-wrap;max-height:500px;overflow:auto;font-size:12px}
button{padding:12px 24px;margin:8px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
.btn{background:#16a34a;color:#fff}.btn2{background:#2563eb;color:#fff}
.status{margin-top:16px;padding:12px;border-radius:6px;font-weight:600}
.ok{background:#1b5e20;color:#a5d6a7}.err{background:#b71c1c;color:#ef9a9a}
</style>
</head>
<body>
<h1>FARN - Recuperar Dados Perdidos</h1>
<p>Esta pagina vai escanear o navegador em busca de dados salvos anteriormente.</p>
<button class="btn" onclick="scanAll()">Escanear Navegador</button>
<button class="btn2" onclick="downloadJSON()">Baixar Dados Encontrados (JSON)</button>
<div id="results"></div>
<script>
let allData = {candidatos:[], turmas:[], ls_candidatos:[], ls_turmas:[]};
const R = document.getElementById('results');

function log(msg) { R.innerHTML += msg + '\n'; }

function scanAll() {
    R.innerHTML = '';
    allData = {candidatos:[], turmas:[], ls_candidatos:[], ls_turmas:[]};
    log('=== ESCANEANDO NAVEGADOR ===\n');

    // 1. Check localStorage
    log('[1] Verificando localStorage...');
    try {
        const lsC = localStorage.getItem('farn_candidatos');
        const lsT = localStorage.getItem('farn_turmas');
        if (lsC) { allData.ls_candidatos = JSON.parse(lsC); log('  -> candidatos encontrados: ' + allData.ls_candidatos.length); }
        else log('  -> candidatos: NENHUM');
        if (lsT) { allData.ls_turmas = JSON.parse(lsT); log('  -> turmas encontradas: ' + allData.ls_turmas.length); }
        else log('  -> turmas: NENHUMA');
    } catch(e) { log('  -> Erro: ' + e.message); }

    // 2. Check IndexedDB FARN_DB v2
    log('\n[2] Verificando IndexedDB (FARN_DB v2)...');
    const dbs = ['FARN_DB'];
    let pending = dbs.length;
    dbs.forEach(name => {
        const req = indexedDB.open(name, 2);
        req.onsuccess = function(e) {
            const db = e.target.result;
            log('  -> DB "' + name + '" aberto. Stores: ' + Array.from(db.objectStoreNames).join(', '));

            let storePending = 0;
            const storeDone = () => { storePending--; if (storePending <= 0) { pending--; if (pending <= 0) finishScan(); } };

            ['candidatos', 'turmas'].forEach(storeName => {
                if (db.objectStoreNames.contains(storeName)) {
                    storePending++;
                    const tx = db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const r = store.getAll();
                    r.onsuccess = () => {
                        const data = r.result || [];
                        log('  -> ' + storeName + ': ' + data.length + ' registros');
                        if (storeName === 'candidatos') allData.candidatos = data;
                        else allData.turmas = data;
                        storeDone();
                    };
                    r.onerror = () => { log('  -> Erro ao ler ' + storeName); storeDone(); };
                } else {
                    log('  -> Store "' + storeName + '" NAO existe');
                }
            });

            if (db.objectStoreNames.length <= 0) {
                log('  -> DB vazio');
                pending--;
                if (pending <= 0) finishScan();
            }
            if (storePending === 0) { pending--; if (pending <= 0) finishScan(); }
        };
        req.onerror = () => { log('  -> Erro ao abrir ' + name); pending--; if (pending <= 0) finishScan(); };
        req.onupgradeneeded = () => { log('  -> DB "' + name + '" esta sendo criado (vazio)'); pending--; if (pending <= 0) finishScan(); };
    });
}

function finishScan() {
    const total = allData.candidatos.length + allData.turmas.length + allData.ls_candidatos.length + allData.ls_turmas.length;
    log('\n=== RESULTADO ===');
    if (total > 0) {
        log('DADOS ENCONTRADOS! Total: ' + total + ' registros');
        log('Clique em "Baixar Dados" para salvar um arquivo JSON.');
        R.className = 'status ok';
    } else {
        log('NENHUM DADO ENCONTRADO no navegador.');
        log('Os dados foram apagados ou este nao e o navegador original.');
        R.className = 'status err';
    }
}

function downloadJSON() {
    const merged = {
        candidatos: [...allData.candidatos, ...allData.ls_candidatos],
        turmas: [...allData.turmas, ...allData.ls_turmas]
    };
    // Deduplicate by CPF for candidatos
    const seenCPF = new Set();
    merged.candidatos = merged.candidatos.filter(c => {
        const key = c.cpf || c.nome;
        if (seenCPF.has(key)) return false;
        seenCPF.add(key);
        return true;
    });
    const blob = new Blob([JSON.stringify(merged, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'farn_recuperado_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
}
</script>
    <!-- Botao voltar pagina anterior -->
    <style>
        #farn-btn-voltar{position:fixed;bottom:16px;left:16px;z-index:2147483000;width:44px;height:44px;border-radius:50%;background:#0a1c40;color:#fff;border:1px solid rgba(212,175,55,.55);box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:transform .15s}
        #farn-btn-voltar:hover{transform:scale(1.08)}
        #farn-btn-voltar:active{transform:scale(.94)}
        @media(max-width:768px){#farn-btn-voltar{bottom:74px}}
    </style>
    <div id="farn-btn-voltar" onclick="farnVoltarPagina()" title="Voltar a pagina anterior"><i class="fa-solid fa-arrow-left"></i></div>
    <script>
    function farnVoltarPagina(){
        if(window.history.length>1){window.history.back();}
        else{window.location.href='index.html';}
    }
    </script>
</body>
</html>
