<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FARN - Acesso ao Sistema</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="farn-db.js"></script>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:Inter,Arial,sans-serif; background:linear-gradient(135deg,#0f766e,#115e59 45%,#0f172a); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .login-box { width:100%; max-width:420px; background:#fff; border-radius:18px; padding:34px 30px; box-shadow:0 18px 50px rgba(0,0,0,.3); }
        .login-brand { text-align:center; margin-bottom:22px; }
        .login-brand img { width:70px; height:70px; object-fit:contain; margin-bottom:10px; }
        .login-brand h1 { font-size:21px; color:#0f172a; }
        .login-brand p { font-size:12px; color:#64748b; margin-top:4px; }
        .login-box label { display:block; font-size:11px; font-weight:700; color:#475569; margin:14px 0 5px; }
        .login-box input { width:100%; padding:12px 13px; border:1px solid #cbd5e1; border-radius:9px; font-size:14px; outline:none; }
        .login-box input:focus { border-color:#0f766e; box-shadow:0 0 0 3px rgba(15,118,110,.12); }
        .login-btn { width:100%; margin-top:22px; padding:13px; border:none; border-radius:10px; background:linear-gradient(135deg,#0f766e,#115e59); color:#fff; font-weight:800; font-size:14px; cursor:pointer; }
        .login-btn:disabled { opacity:.6; cursor:not-allowed; }
        .login-erro { margin-top:12px; color:#dc2626; font-size:12px; display:none; text-align:center; }
        .login-voltar { display:block; text-align:center; margin-top:16px; font-size:12px; color:#64748b; text-decoration:none; }
        .login-voltar:hover { color:#0f766e; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-brand">
            <img data-farn-logo src="logo-farn.png.png" alt="FARN">
            <h1>Acesso ao Sistema</h1>
            <p>Entre com seu CPF e senha</p>
        </div>
        <form onsubmit="return fazerLogin(event)" autocomplete="off">
            <label for="lg-cpf">CPF</label>
            <input type="text" id="lg-cpf" placeholder="000.000.000-00" maxlength="14" oninput="formatarCpf(this)">
            <label for="lg-senha">Senha</label>
            <input type="password" id="lg-senha" placeholder="Sua senha" autocomplete="current-password">
            <button type="submit" class="login-btn" id="lg-btn"><i class="fa-solid fa-right-to-bracket" style="margin-right:6px"></i> Entrar</button>
            <div class="login-erro" id="lg-erro"></div>
        </form>
        <a href="index.html" class="login-voltar"><i class="fa-solid fa-arrow-left" style="margin-right:4px"></i> Voltar ao início</a>
    </div>

    <script>
        /* O login administrativo NAO depende do banco: se o modulo falhar,
           as credenciais do admin continuam funcionando. */
        var dbFirestore = null;
        try { if (typeof FarnDB === 'function') dbFirestore = new FarnDB('https://farn-api.farn-api-farn.workers.dev'); }
        catch (e) { console.warn('Modulo do banco indisponivel no login:', e); }
        var ADMIN_CPF = '05004959471';
        var ADMIN_SENHA = '212121';

        function formatarCpf(el) {
            var v = el.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
            else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
            else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
            el.value = v;
        }
        function soDigitos(v) { return String(v || '').replace(/\D/g, ''); }
        function erro(msg) { var e = document.getElementById('lg-erro'); if (e) { e.textContent = msg; e.style.display = 'block'; } }

        async function fazerLogin(ev) {
            if (ev) ev.preventDefault();
            var cpf = soDigitos((document.getElementById('lg-cpf') || {}).value);
            var senha = (document.getElementById('lg-senha') || {}).value || '';
            var btn = document.getElementById('lg-btn');
            var e = document.getElementById('lg-erro'); if (e) e.style.display = 'none';
            if (cpf.length !== 11 || !senha) { erro('Informe CPF e senha.'); return false; }
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...'; }
            try {
                /* Administrador: CPF e senha fixos */
                if (cpf === ADMIN_CPF && senha === ADMIN_SENHA) {
                    var admin = { nome: 'Administrador Geral', cpf: cpf, permissoes: ['admin', 'pre-inscricao', 'docente', 'usuarios'] };
                    localStorage.setItem('farn_login', 'admin');
                    localStorage.setItem('farn_user_data', JSON.stringify(admin));
                    location.href = 'index.html?admin=1';
                    return true;
                }
                /* Demais usuarios: Cadastro Geral dos Individuos com status Ativo */
                var fontes = [
                    { col: 'candidatos', rotulo: 'Aluno / Formado' },
                    { col: 'docentes', rotulo: 'Docente' },
                    { col: 'usuarios', rotulo: 'Usuário' },
                    { col: 'cffAlunos', rotulo: 'CFF' }
                ];
                var encontrado = null;
                if (!dbFirestore) { erro('Banco indisponível no momento. Tente novamente.'); }
                for (var i = 0; i < fontes.length && !encontrado && dbFirestore; i++) {
                    var snap = await dbFirestore.collection(fontes[i].col).where('cpf', '==', cpf).get();
                    var user = null;
                    snap.forEach(function (doc) {
                        if (user) return;
                        var d = doc.data() || {};
                        if (d.senha !== senha) return;
                        var status = d.status || (fontes[i].col === 'usuarios' && d.ativo === false ? 'Inativo' : 'Ativo');
                        if (status !== 'Ativo' && status !== 'Acadêmico' && status !== 'Formado') return;
                        user = Object.assign({}, d, { _origem: fontes[i].col, _rotulo: fontes[i].rotulo, _docId: doc.id });
                    });
                    if (user) { encontrado = user; break; }
                }
                if (!encontrado) { erro('CPF/senha inválidos ou cadastro não está Ativo.'); }
                else {
                    localStorage.setItem('pu_sessao', JSON.stringify(encontrado));
                    localStorage.setItem('farn_user_data', JSON.stringify(encontrado));
                    location.href = 'portal-usuario.html';
                    return true;
                }
            } catch (ex) { erro('Falha ao acessar: ' + ex.message); }
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket" style="margin-right:6px"></i> Entrar'; }
            return false;
        }
    </script>
</body>
</html>
