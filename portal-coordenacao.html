<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal da Coordenação - FARN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{
            --green:#9333ea;--green-l:#a855f7;--green-d:#7e22ce;
            --red:#dc2626;--red-l:#ef4444;
            --blue:#2563eb;--blue-l:#3b82f6;
            --yellow:#ca8a04;--yellow-l:#eab308;--yellow-xl:#facc15;
            --white:#ffffff;--off:#f8fafc;--gray100:#f1f5f9;--gray200:#e2e8f0;--gray300:#cbd5e1;--gray400:#94a3b8;--gray500:#64748b;--gray600:#475569;--gray700:#334155;--gray800:#1e293b;--gray900:#0f172a;
            --shadow:0 4px 24px rgba(0,0,0,.08);--shadow-lg:0 12px 40px rgba(0,0,0,.12);
            --radius:16px;--radius-sm:12px;--radius-xs:8px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gray100);color:var(--gray800);min-height:100vh;overflow:hidden}
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:var(--gray200)}
        ::-webkit-scrollbar-thumb{background:var(--green);border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:var(--green-d)}

        /* ===== LOGIN ===== */
        #screen-login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--green-d) 0%,var(--green) 40%,var(--green-l) 70%,#c084fc 100%);position:relative;overflow:hidden}
        /* Login agora é centralizado na landing - esconder tela de login do portal */
        #screen-login { display: none !important; }
        #screen-login::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(255,255,255,.12) 0%,transparent 70%);top:-250px;right:-150px;border-radius:50%}
        #screen-login::after{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 70%);bottom:-200px;left:-100px;border-radius:50%}
        .pf-login-card{background:rgba(255,255,255,.97);border:none;border-radius:28px;padding:44px 36px;width:100%;max-width:400px;position:relative;z-index:1;box-shadow:0 20px 60px rgba(0,0,0,.2)}
        .pf-login-logo{text-align:center;margin-bottom:32px}
        .pf-login-logo img{width:90px;margin-bottom:14px}
        .pf-login-logo h1{font-size:22px;color:var(--gray800);margin-bottom:4px;font-weight:800;letter-spacing:-.3px}
        .pf-login-logo h1 span{color:var(--green)}
        .pf-login-logo p{font-size:12px;color:var(--gray500);letter-spacing:.5px}
        .pf-login-field{margin-bottom:16px}
        .pf-login-field label{display:block;font-size:10px;color:var(--gray500);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
        .pf-login-field input{width:100%;padding:13px 16px;background:var(--gray100);border:2px solid var(--gray200);border-radius:var(--radius-sm);color:var(--gray800);font-size:14px;transition:.3s}
        .pf-login-field input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(147,51,234,.1)}
        .pf-login-field input::placeholder{color:var(--gray400)}
        .pf-login-remember{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:12px;color:var(--gray500)}
        .pf-login-remember input[type=checkbox]{accent-color:var(--green)}
        .pf-login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--green),var(--green-d));border:none;border-radius:var(--radius-sm);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.3s;letter-spacing:.3px;box-shadow:0 4px 16px rgba(147,51,234,.3)}
        .pf-login-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(147,51,234,.4)}
        .pf-login-btn:active:not(:disabled){transform:translateY(0)}
        .pf-login-btn:disabled{opacity:.5;cursor:not-allowed}
        .pf-login-error{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);color:var(--red);border-radius:var(--radius-xs);padding:10px 14px;font-size:12px;text-align:center;margin-bottom:14px;display:none}
        .pf-login-back{display:block;text-align:center;margin-top:16px;font-size:12px;color:var(--gray500);text-decoration:none;transition:.2s}
        .pf-login-back:hover{color:var(--green)}

        /* ===== PORTAL ===== */
        #screen-portal{display:none;flex-direction:column;height:100vh}
        #screen-portal.active{display:flex}

        /* Top Bar */
        .pf-topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:60px;background:linear-gradient(90deg,var(--green),var(--green-d));flex-shrink:0;position:relative;z-index:95;box-shadow:0 4px 20px rgba(147,51,234,.2)}
        .pf-topbar-left{display:flex;align-items:center;gap:12px}
        .pf-topbar-logo{height:38px;background:#fff;border-radius:10px;padding:4px;object-fit:contain}
        .pf-topbar-title{color:#fff;font-weight:800;font-size:15px;letter-spacing:.3px}
        .pf-topbar-right{display:flex;align-items:center;gap:12px}
        .pf-user-info{display:flex;flex-direction:column;align-items:flex-end;color:#fff;line-height:1.3}
        .pf-user-name{font-size:13px;font-weight:700}
        .pf-user-cpf{font-size:11px;opacity:.85}
        .pf-user-avatar{width:38px;height:38px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
        .pf-logout-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.25s}
        .pf-logout-btn:hover{background:rgba(255,255,255,.28)}

        /* Body */
        .pf-body{flex:1;overflow:auto}

        /* ===== EM CONSTRUCAO ===== */
        .construcao-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 60px);padding:24px}
        .construcao-card{background:#fff;border-radius:var(--radius);padding:56px 48px;max-width:460px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
        .construcao-icon{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,rgba(147,51,234,.12),rgba(192,132,252,.12));display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
        .construcao-icon i{font-size:40px;color:var(--green)}
        .construcao-card h2{font-size:22px;font-weight:800;color:var(--gray800);margin-bottom:12px;letter-spacing:-.3px}
        .construcao-card p{font-size:14px;color:var(--gray500);line-height:1.7}
        .construcao-tag{display:inline-block;margin-top:20px;background:linear-gradient(135deg,rgba(147,51,234,.1),rgba(192,132,252,.1));color:var(--green-d);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:6px 14px;border-radius:20px}

        @media (max-width:768px){
            .pf-topbar{padding:0 14px}
            .pf-topbar-title{display:none}
            .pf-user-info{display:none}
            .construcao-card{padding:40px 24px}
        }
    </style>
</head>
<body>

    <!-- TELA LOGIN -->
    <div id="screen-login">
        <div class="pf-login-card">
            <div class="pf-login-logo">
                <img data-farn-logo src="logo-farn.png.png" alt="FARN">
                <h1>Portal da <span>Coordenação</span></h1>
                <p>Acesse sua conta</p>
            </div>
            <div class="pf-login-error" id="pc-login-error"></div>
            <div class="pf-login-field">
                <label>CPF</label>
                <input type="text" id="pc-cpf" placeholder="000.000.000-00" maxlength="14" oninput="pcFormatCPF(this)">
            </div>
            <div class="pf-login-field">
                <label>Senha</label>
                <input type="password" id="pc-senha" placeholder="Sua senha" onkeydown="if(event.key==='Enter')pcLogin()">
            </div>
            <div class="pf-login-remember">
                <input type="checkbox" id="pc-lembrar">
                <label for="pc-lembrar">Lembrar minha senha</label>
            </div>
            <button class="pf-login-btn" id="pc-login-btn" onclick="pcLogin()">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar
            </button>
            <a class="pf-login-back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
        </div>
    </div>

    <!-- TELA PORTAL -->
    <div id="screen-portal">

        <!-- TOP BAR -->
        <div class="pf-topbar">
            <div class="pf-topbar-left">
                <img class="pf-topbar-logo" data-farn-logo src="logo-farn.png.png" alt="FARN">
                <span class="pf-topbar-title">Portal da Coordenação</span>
            </div>
            <div class="pf-topbar-right">
                <div class="pf-user-info">
                    <div class="pf-user-name" id="pc-user-name">---</div>
                    <div class="pf-user-cpf" id="pc-user-cpf"></div>
                </div>
                <div class="pf-user-avatar" id="pc-user-avatar">--</div>
                <button class="pf-logout-btn" onclick="pcLogout()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
            </div>
        </div>

        <div class="pf-body">
            <div class="construcao-wrap">
                <div class="construcao-card">
                    <div class="construcao-icon"><i class="fa-solid fa-person-digging"></i></div>
                    <h2>Em construção</h2>
                    <p>O Portal da Coordenação está sendo preparado. Em breve, você terá acesso a todas as funcionalidades da coordenação.</p>
                    <span class="construcao-tag"><i class="fa-solid fa-wrench"></i> Em breve</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script>
        /* ===== FIREBASE ===== */
        var firebaseConfig={apiKey:"AIzaSyCjKeFfSkQp9wPxsEytxr9Vrl9g_HmdfF0",authDomain:"farn-app.firebaseapp.com",databaseURL:"https://farn-app-default-rtdb.firebaseio.com",projectId:"farn-app",storageBucket:"farn-app.firebasestorage.app",messagingSenderId:"16254677061",appId:"1:16254677061:web:3d42c64edfe5cdbffcf32c"};
        if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
        var dbFirestore=firebase.firestore();

        /* ===== ESTADO ===== */
        var pcUser=null;

        /* ===== FORMATACAO ===== */
        function pcFormatCPF(input) {
            var v = input.value.replace(/\D/g, '');
            if (v.length > 11) v = v.slice(0, 11);
            if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
            else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
            else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
            input.value = v;
        }

        /* ===== LOGIN ===== */
        async function pcLogin() {
            var cpf = document.getElementById('pc-cpf').value.replace(/\D/g, '');
            var senha = document.getElementById('pc-senha').value;
            var errEl = document.getElementById('pc-login-error');
            var btn = document.getElementById('pc-login-btn');

            errEl.style.display = 'none';

            if (!cpf || !senha) {
                errEl.textContent = 'Informe CPF e senha.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';

            try {
                var snap = await dbFirestore.collection('usuarios').where('cpf', '==', cpf).get();
                if (snap.empty) {
                    errEl.textContent = 'CPF ou senha invalidos';
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar';
                    return;
                }
                var doc = null;
                snap.forEach(function(d) { doc = d; });
                var u = doc.data();
                if (u.senha !== senha) {
                    errEl.textContent = 'CPF ou senha invalidos';
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar';
                    return;
                }
                if (u.ativo === false) {
                    errEl.textContent = 'Usuario desativado. Contate o administrador.';
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar';
                    return;
                }
                pcUser = u;
                pcUser._docId = doc.id;

                /* Lembrar usuario e senha */
                if (document.getElementById('pc-lembrar').checked) {
                    localStorage.setItem('pc_lembrar_cpf', cpf);
                    localStorage.setItem('pc_lembrar_senha', senha);
                } else {
                    localStorage.removeItem('pc_lembrar_cpf');
                    localStorage.removeItem('pc_lembrar_senha');
                }

                document.getElementById('screen-login').style.display = 'none';
                document.getElementById('screen-portal').classList.add('active');

                var initials = (pcUser.nome || 'CO').split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase();
                document.getElementById('pc-user-avatar').textContent = initials;
                document.getElementById('pc-user-name').textContent = pcUser.nome || '---';
                var cpfDisp = pcUser.cpf || '';
                if (cpfDisp.length === 11) cpfDisp = cpfDisp.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
                document.getElementById('pc-user-cpf').textContent = 'CPF: ' + cpfDisp;

            } catch(e) {
                console.error('Erro login coordenacao:', e);
                errEl.textContent = 'Erro ao acessar. Tente novamente.';
                errEl.style.display = 'block';
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar';
        }

        function pcAutoLogin() {
            var cpfSalvo = localStorage.getItem('pc_lembrar_cpf');
            var senhaSalva = localStorage.getItem('pc_lembrar_senha');
            if (cpfSalvo && senhaSalva) {
                document.getElementById('pc-cpf').value = cpfSalvo.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
                document.getElementById('pc-senha').value = senhaSalva;
                document.getElementById('pc-lembrar').checked = true;
                pcLogin();
            }
        }

        function pcLogout() {
            document.getElementById('screen-portal').classList.remove('active');
            localStorage.removeItem('pc_lembrar_cpf');
            localStorage.removeItem('pc_lembrar_senha');
            pcUser = null;
            location.href = 'index.html';
        }

        /* Auto login se houver credenciais salvas */
        if (document.getElementById('pc-cpf')) pcAutoLogin();
        /* Se não há credenciais salvas, redirecionar para landing */
        if (!localStorage.getItem('pc_lembrar_cpf') && !localStorage.getItem('pc_lembrar_senha')) {
            location.replace('index.html');
        }

        /* Carregar logo da instituicao */
        dbFirestore.collection('configuracoes').doc('instituicao').get().then(function(doc){
            if(doc.exists && doc.data().logo){
                document.querySelectorAll('[data-farn-logo]').forEach(function(img){ img.src = doc.data().logo; });
            }
        }).catch(function(){});
    </script>
</body>
</html>
